[build]
  command = "npm run build"
  publish = "out"

# Environment variables
[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_VERSION = "20" 

# No catch-all rewrite. The previous `/* -> /index.html 200` rule meant every
# unknown URL answered 200 with the homepage, which search engines read as a soft
# 404 and which dilutes indexing. Next's static export emits a real 404.html and
# Netlify serves it automatically.

# Add headers for security and caching but allow necessary resources
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' fonts.googleapis.com cdnjs.cloudflare.com; font-src 'self' fonts.gstatic.com cdnjs.cloudflare.com; img-src 'self' data: blob:; connect-src 'self';"

# Proper MIME types for JavaScript files
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "application/javascript"

# Proper MIME types for CSS files
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "text/css"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"